<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fixtures — World Cup 2026 Tipping</title>
  
  <script src="js/env-config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
  <script src="js/flags.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1d4ed8; --blue-d: #1e3a8a; --gold: #f59e0b;
      --bg: #f1f5f9; --card: #fff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --radius: 16px; --red: #dc2626; --green: #16a34a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Nav */
    #nav { background: var(--blue-d); color: #fff; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .nav-inner { max-width: 1000px; margin: 0 auto; padding: 0 1.25rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-home { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; white-space: nowrap; }
    .nav-home:hover { color: #fff; }
    .nav-center { flex: 1; text-align: center; }
    .nav-title { font-weight: 800; font-size: 1rem; color: #fff; }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .nav-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.88rem; padding: 0.3rem 0.6rem; border-radius: 8px; transition: background 0.15s; }
    .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
    .btn-primary-sm { background: var(--gold); color: #1e293b; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.8); padding: 0.3rem 0.7rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    /* Page header */
    .page-header { background: linear-gradient(135deg, var(--blue-d), var(--blue)); color: #fff; padding: 1.75rem 1.5rem 1.5rem; text-align: center; }
    .page-header h1 { font-size: 1.5rem; font-weight: 900; }
    .page-header p { color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-top: 0.3rem; }

    /* Guest banner */
    .guest-banner { background: #fffbeb; border-bottom: 1px solid #fde68a; padding: 0.75rem 1.5rem; text-align: center; font-size: 0.9rem; color: #92400e; display: none; }
    .guest-banner a { color: var(--blue); font-weight: 700; }

    /* Filters */
    .filters { max-width: 900px; margin: 1.5rem auto 0; padding: 0 1.25rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .filter-btn { padding: 0.4rem 1rem; border-radius: 99px; border: 1.5px solid var(--border); background: var(--card); font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: all 0.15s; }
    .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
    .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    main { max-width: 900px; margin: 1.25rem auto 3rem; padding: 0 1.25rem; }

    /* Day group */
    .day-group { margin-bottom: 1.75rem; }
    .day-label { font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
    .day-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* Match card */
    .match-card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 0.75rem; overflow: hidden; transition: box-shadow 0.15s; }
    .match-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

    .match-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem 0; }
    .match-meta { font-size: 0.78rem; color: var(--muted); }
    .match-status { font-size: 0.75rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 99px; }
    .status-scheduled { background: #dbeafe; color: #1e40af; }
    .status-live      { background: #fee2e2; color: #991b1b; animation: pulse 1.5s infinite; }
    .status-finished  { background: #f1f5f9; color: var(--muted); }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:0.6 } }

    .match-body { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0.9rem 1rem 0.75rem; gap: 0.5rem; }

    .team { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; text-align: center; }
    .team-flag { font-size: 2.2rem; line-height: 1; }
    .team-name { font-size: 0.88rem; font-weight: 700; color: var(--text); }
    .team-rank { font-size: 0.72rem; font-weight: 700; color: var(--muted); background: #f1f5f9; padding: 0.1rem 0.4rem; border-radius: 99px; margin-top: 0.1rem; }

    .vs-block { text-align: center; flex-shrink: 0; }
    .vs-text { font-size: 0.78rem; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; }
    .score-display { font-size: 1.6rem; font-weight: 900; color: var(--text); letter-spacing: 0.05em; }
    .match-time { font-size: 0.82rem; color: var(--muted); margin-top: 0.2rem; }

    /* Tip section */
    .tip-section { padding: 0 1rem 1rem; }
    .tip-buttons { display: flex; gap: 0.5rem; }
    .tip-btn {
      flex: 1; padding: 0.55rem 0.4rem; border-radius: 10px;
      border: 2px solid var(--border); background: #f8fafc;
      font-size: 0.82rem; font-weight: 700; cursor: pointer;
      color: var(--muted); transition: all 0.15s; text-align: center;
    }
    .tip-btn:hover { border-color: var(--blue); color: var(--blue); background: #eff6ff; }
    .tip-btn.selected { border-color: var(--blue); background: var(--blue); color: #fff; }
    .tip-btn:disabled { cursor: not-allowed; }

    .tip-result { font-size: 0.82rem; margin-top: 0.5rem; color: var(--muted); text-align: center; }
    .tip-result .correct { color: var(--green); font-weight: 700; }
    .tip-result .wrong   { color: var(--red); font-weight: 700; }
    .tip-result .pending { color: var(--muted); }

    /* Finished match pick display */
    .pick-display { display: flex; align-items: center; justify-content: center; gap: 0.6rem; padding: 0.6rem 1rem; border-radius: 10px; font-size: 0.9rem; font-weight: 700; }
    .pick-display.correct { background: #f0fdf4; border: 1.5px solid #86efac; color: #166534; }
    .pick-display.wrong   { background: #fef2f2; border: 1.5px solid #fca5a5; color: #991b1b; }
    .pick-display.no-pick { background: #f8fafc; border: 1.5px solid var(--border); color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    .pick-display .pick-flag { font-size: 1.2rem; }
    .pick-display .pick-outcome { font-size: 1.1rem; }

    /* All tips panel */
    .all-tips-toggle { width: 100%; background: none; border: none; border-top: 1px solid var(--border); padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.4rem; transition: background 0.15s, color 0.15s; }
    .all-tips-toggle:hover { background: #f8fafc; color: var(--blue); }
    .all-tips-toggle .chevron { font-size: 0.65rem; transition: transform 0.2s; display: inline-block; }
    .all-tips-toggle.open .chevron { transform: rotate(180deg); }

    .all-tips-panel { display: none; border-top: 1px solid var(--border); padding: 0.85rem 1rem; }
    .all-tips-panel.open { display: block; }

    .tips-summary { display: flex; gap: 0.5rem; margin-bottom: 0.85rem; }
    .tips-bar-item { flex: 1; background: #f8fafc; border-radius: 8px; padding: 0.45rem 0.6rem; text-align: center; font-size: 0.78rem; border: 1.5px solid var(--border); }
    .tips-bar-item.is-result { border-color: var(--green); background: #f0fdf4; }
    .tips-bar-item .bar-label { font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tips-bar-item .bar-count { font-size: 1.1rem; font-weight: 900; color: var(--blue-d); margin-top: 0.1rem; }
    .tips-bar-item.is-result .bar-count { color: var(--green); }

    .tips-list { display: flex; flex-direction: column; gap: 0.3rem; }
    .tip-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0.5rem; border-radius: 7px; font-size: 0.83rem; }
    .tip-row.tip-correct { background: #f0fdf4; }
    .tip-row.tip-wrong   { background: #fef2f2; }
    .tip-row.tip-none    { background: #f8fafc; opacity: 0.65; }
    .tip-row .tr-name    { flex: 1; font-weight: 600; }
    .tip-row .tr-pick    { color: var(--muted); font-size: 0.8rem; }
    .tip-row .tr-icon    { font-size: 0.95rem; }
    .tips-loading { text-align: center; color: var(--muted); font-size: 0.82rem; padding: 0.5rem; }

    .tip-locked { font-size: 0.8rem; color: var(--muted); text-align: center; padding: 0.4rem 0; }

    .login-prompt { font-size: 0.82rem; color: var(--muted); text-align: center; padding: 0.25rem; }
    .login-prompt a { color: var(--blue); font-weight: 700; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    .loading { text-align: center; padding: 4rem; color: var(--muted); }

    .sync-btn { display: flex; align-items: center; gap: 0.4rem; margin-left: auto; background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 0.3rem 0.7rem; font-size: 0.8rem; color: var(--muted); cursor: pointer; }
    .sync-btn:hover { border-color: var(--blue); color: var(--blue); }
    .top-bar { max-width: 900px; margin: 0.75rem auto 0; padding: 0 1.25rem; display: flex; align-items: center; }

    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 1rem; }
  </style>
</head>
<body>

<nav id="nav"></nav>

<div class="page-header">
  <h1>📅 Fixtures &amp; Tips</h1>
  <p>Pick a winner before kick-off — tips lock when the game starts</p>
</div>

<div class="guest-banner" id="guest-banner">
  <a href="auth.html">Register or login</a> to submit your tips and appear on the leaderboard.
</div>

<div class="top-bar">
  <div class="filters" style="margin:0;padding:0;flex:1;">
    <button class="filter-btn active" onclick="setFilter('upcoming')">Upcoming</button>
    <button class="filter-btn" onclick="setFilter('today')">Today</button>
    <button class="filter-btn" onclick="setFilter('all')">All</button>
    <button class="filter-btn" onclick="setFilter('finished')">Completed</button>
  </div>
  <button class="sync-btn" onclick="syncMatches()" title="Refresh match data">
    🔄 <span id="sync-label">Refresh</span>
  </button>
</div>

<main id="main">
  <div class="loading">Loading fixtures…</div>
</main>

<footer>Made with ☀️ in Australia &nbsp;·&nbsp; Part of <a href="https://mrssteynsgames.netlify.app" style="color:inherit">Mrs Steyn's Games</a></footer>

<script src="js/supabase-client.js"></script>
<script>
let currentFilter = 'upcoming';
let currentUser   = null;
let allMatches    = [];
let myPicks       = {};  // matchId → pick

async function init() {
  await renderNav('fixtures');
  currentUser = await getUser();

  if (!currentUser) {
    document.getElementById('guest-banner').style.display = 'block';
  }

  await loadData();
}

async function loadData() {
  // Trigger a background sync of match results
  syncMatches(false);

  const [matchesRes, picksRes] = await Promise.all([
    SB.get('matches', `tournament_code=eq.${TOURNAMENT.code}&order=match_date`),
    currentUser
      ? SB.get('picks', `player_id=eq.${currentUser.id}`)
      : Promise.resolve({ data: [] }),
  ]);

  allMatches = matchesRes.data ?? [];
  myPicks = {};
  (picksRes.data ?? []).forEach(p => { myPicks[p.match_id] = p.pick; });

  renderMatches();
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach((b, i) => {
    b.classList.toggle('active', ['upcoming','today','all','finished'][i] === f);
  });
  renderMatches();
}

function filteredMatches() {
  const now = new Date();
  const todayStr = now.toDateString();
  switch (currentFilter) {
    case 'upcoming': return allMatches.filter(m => new Date(m.match_date) > now && m.status !== 'FINISHED');
    case 'today':    return allMatches.filter(m => new Date(m.match_date).toDateString() === todayStr);
    case 'finished': return allMatches.filter(m => m.status === 'FINISHED');
    default:         return allMatches;
  }
}

function renderMatches() {
  const matches = filteredMatches();
  const main = document.getElementById('main');

  if (matches.length === 0) {
    main.innerHTML = `<div class="empty-state"><span class="empty-icon">📭</span><p>No matches for this filter.</p></div>`;
    return;
  }

  // Group by date
  const groups = {};
  matches.forEach(m => {
    const d = new Date(m.match_date);
    const key = d.toDateString();
    if (!groups[key]) groups[key] = [];
    groups[key].push(m);
  });

  main.innerHTML = Object.entries(groups).map(([dateStr, ms]) => {
    const d = new Date(dateStr);
    const label = formatDayLabel(d);
    const cards = ms.map(m => matchCard(m)).join('');
    return `<div class="day-group"><div class="day-label">${label}</div>${cards}</div>`;
  }).join('');
}

function matchCard(m) {
  const now      = new Date();
  const kickoff  = new Date(m.match_date);
  const isLocked = kickoff <= now;
  const myPick   = myPicks[m.id] ?? null;

  const flag1  = getFlag(m.team1, m.team1_country_code);
  const flag2  = getFlag(m.team2, m.team2_country_code);
  const rank1  = rankLabel(m.team1);
  const rank2  = rankLabel(m.team2);

  const stageName = TOURNAMENT.stages[m.stage] ?? m.stage ?? '';
  const groupPart = m.group_name ? ` · ${m.group_name}` : '';
  const meta = `${stageName}${groupPart}`;

  const statusBadge = m.status === 'LIVE'
    ? `<span class="match-status status-live">🔴 LIVE</span>`
    : m.status === 'FINISHED'
    ? `<span class="match-status status-finished">Full Time</span>`
    : `<span class="match-status status-scheduled">Upcoming</span>`;

  // Score or time
  let vsBlock = '';
  if (m.status === 'FINISHED' || m.status === 'LIVE') {
    const s1 = m.team1_score ?? 0;
    const s2 = m.team2_score ?? 0;
    vsBlock = `<div class="vs-block"><div class="score-display">${s1} – ${s2}</div></div>`;
  } else {
    const timeStr = kickoff.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
    vsBlock = `<div class="vs-block"><div class="vs-text">VS</div><div class="match-time">${timeStr}</div></div>`;
  }

  // Tip section
  let tipHTML = '';
  if (m.status === 'FINISHED') {
    tipHTML = finishedTipHTML(m, myPick, flag1, flag2);
  } else if (isLocked) {
    tipHTML = `<div class="tip-section"><div class="tip-locked">⏰ Tips locked — match in progress</div></div>`;
  } else if (!currentUser) {
    tipHTML = `<div class="tip-section"><div class="login-prompt"><a href="auth.html">Login to tip this match</a></div></div>`;
  } else {
    tipHTML = openTipHTML(m, myPick, flag1, flag2);
  }

  return `
    <div class="match-card" id="match-${m.id}">
      <div class="match-header">
        <span class="match-meta">${escHtml(meta)}</span>
        ${statusBadge}
      </div>
      <div class="match-body">
        <div class="team">
          <span class="team-flag">${flag1}</span>
          <span class="team-name">${escHtml(m.team1)}</span>
          ${rank1 ? `<span class="team-rank">${rank1}</span>` : ''}
        </div>
        ${vsBlock}
        <div class="team">
          <span class="team-flag">${flag2}</span>
          <span class="team-name">${escHtml(m.team2)}</span>
          ${rank2 ? `<span class="team-rank">${rank2}</span>` : ''}
        </div>
      </div>
      ${tipHTML}
    </div>`;
}

function openTipHTML(m, myPick, flag1, flag2) {
  const r1 = rankLabel(m.team1);
  const r2 = rankLabel(m.team2);
  const opts = [
    { value: 'TEAM1', label: `${flag1} ${m.team1}${r1 ? ' ' + r1 : ''}` },
    { value: 'DRAW',  label: 'Draw' },
    { value: 'TEAM2', label: `${flag2} ${m.team2}${r2 ? ' ' + r2 : ''}` },
  ];
  const btns = opts.map(o => {
    const sel = myPick === o.value ? ' selected' : '';
    return `<button class="tip-btn${sel}" onclick="submitPick(${m.id}, '${o.value}')">${escHtml(o.label)}</button>`;
  }).join('');
  const hint = myPick ? `<div class="tip-result"><span class="pending">✏️ Tip saved — you can change it until kick-off</span></div>` : '';
  return `<div class="tip-section"><div class="tip-buttons">${btns}</div>${hint}</div>`;
}

function finishedTipHTML(m, myPick, flag1, flag2) {
  const myPickHTML = (() => {
    if (!myPick) {
      return `<div class="pick-display no-pick">No tip submitted</div>`;
    }
    const isCorrect = myPick === m.result;
    const pickFlag  = myPick === 'TEAM1' ? flag1 : myPick === 'TEAM2' ? flag2 : '';
    const pickName  = myPick === 'TEAM1' ? m.team1 : myPick === 'TEAM2' ? m.team2 : 'Draw';
    return `<div class="pick-display ${isCorrect ? 'correct' : 'wrong'}">
      <span>Your tip:</span>
      ${pickFlag ? `<span class="pick-flag">${pickFlag}</span>` : ''}
      <span>${escHtml(pickName)}</span>
      <span class="pick-outcome">${isCorrect ? '✅' : '❌'}</span>
    </div>`;
  })();

  return `<div class="tip-section">${myPickHTML}</div>
    <button class="all-tips-toggle" onclick="toggleAllTips(${m.id}, this)" data-match-id="${m.id}">
      👥 See all tips <span class="chevron">▼</span>
    </button>
    <div class="all-tips-panel" id="all-tips-${m.id}"></div>`;
}

async function submitPick(matchId, pick) {
  if (!currentUser) { window.location.href = 'auth.html'; return; }

  // Optimistic UI update
  myPicks[matchId] = pick;
  renderMatches();

  const { error } = await SB.upsert('picks',
    { player_id: currentUser.id, match_id: matchId, pick, updated_at: new Date().toISOString() },
    'player_id,match_id'
  );

  if (error) {
    alert('Could not save your tip. Please try again.');
    delete myPicks[matchId];
    renderMatches();
  }
}

async function syncMatches(showFeedback = true) {
  const label = document.getElementById('sync-label');
  if (showFeedback && label) label.textContent = 'Syncing…';
  try {
    const res = await fetch('/.netlify/functions/sync-matches');
    if (res.ok && showFeedback) {
      // Reload matches after sync
      const { data } = await SB.get('matches', `tournament_code=eq.${TOURNAMENT.code}&order=match_date`);
      if (data) {
        allMatches = data;
        renderMatches();
      }
    }
  } catch (_) { /* silent fail — function may not be deployed yet */ }
  if (showFeedback && label) label.textContent = 'Refresh';
}

// ── All tips panel ───────────────────────────────────────────────────────

const loadedTips = {}; // cache per match
let poolMemberIds = null; // cached pool member list

async function getPoolMembers() {
  if (poolMemberIds !== null) return poolMemberIds;
  if (!currentUser) { poolMemberIds = []; return poolMemberIds; }

  const poolId = localStorage.getItem(`${TOURNAMENT.code}_active_pool`);
  if (!poolId) {
    // Fallback: find any pool this user belongs to
    const { data: memberships } = await SB.get('pool_members',
      `player_id=eq.${currentUser.id}&select=pool_id&limit=1`
    );
    const pid = memberships?.[0]?.pool_id;
    if (!pid) { poolMemberIds = []; return poolMemberIds; }
    const { data: members } = await SB.get('pool_members', `pool_id=eq.${pid}&select=player_id`);
    poolMemberIds = (members ?? []).map(m => m.player_id);
  } else {
    const { data: members } = await SB.get('pool_members', `pool_id=eq.${poolId}&select=player_id`);
    poolMemberIds = (members ?? []).map(m => m.player_id);
  }
  return poolMemberIds;
}

async function toggleAllTips(matchId, btn) {
  const panel = document.getElementById(`all-tips-${matchId}`);
  const isOpen = panel.classList.contains('open');

  if (isOpen) {
    panel.classList.remove('open');
    btn.classList.remove('open');
    return;
  }

  panel.classList.add('open');
  btn.classList.add('open');

  if (loadedTips[matchId]) {
    renderAllTips(matchId, loadedTips[matchId]);
    return;
  }

  panel.innerHTML = `<div class="tips-loading">Loading…</div>`;

  const memberIds = await getPoolMembers();

  // Fetch picks for this match, scoped to pool members
  const picksQuery = memberIds.length
    ? `match_id=eq.${matchId}&player_id=in.(${memberIds.join(',')})&select=pick,player_id,profiles(display_name)`
    : `match_id=eq.${matchId}&select=pick,player_id,profiles(display_name)`;

  const { data } = await SB.get('picks', picksQuery);

  // Pool member profiles (including those who didn't pick)
  const profilesQuery = memberIds.length
    ? `id=in.(${memberIds.join(',')})&select=id,display_name`
    : `select=id,display_name`;
  const { data: profiles } = await SB.get('profiles', profilesQuery);

  const match = allMatches.find(m => m.id === matchId);
  loadedTips[matchId] = { picks: data ?? [], profiles: profiles ?? [], match };
  renderAllTips(matchId, loadedTips[matchId]);
}

function renderAllTips(matchId, { picks, profiles, match }) {
  const panel = document.getElementById(`all-tips-${matchId}`);
  if (!panel) return;

  const flag1 = getFlag(match.team1, match.team1_country_code);
  const flag2 = getFlag(match.team2, match.team2_country_code);

  // Build pick map: player_id → pick
  const pickMap = {};
  picks.forEach(p => { pickMap[p.player_id] = p.pick; });

  // Count picks for summary bar
  const counts = { TEAM1: 0, DRAW: 0, TEAM2: 0, none: 0 };
  profiles.forEach(p => {
    const pick = pickMap[p.id];
    if (pick) counts[pick] = (counts[pick] ?? 0) + 1;
    else counts.none++;
  });

  const total = profiles.length;
  const pct = n => total ? Math.round(n / total * 100) : 0;

  const summaryItems = [
    { value: 'TEAM1', flag: flag1, name: match.team1, count: counts.TEAM1 },
    { value: 'DRAW',  flag: '🤝',  name: 'Draw',      count: counts.DRAW  },
    { value: 'TEAM2', flag: flag2, name: match.team2, count: counts.TEAM2 },
  ];

  const summaryHTML = `<div class="tips-summary">${summaryItems.map(item => {
    const isResult = item.value === match.result;
    return `<div class="tips-bar-item${isResult ? ' is-result' : ''}">
      <div class="bar-label">${item.flag} ${escHtml(item.name)}${isResult ? ' ✓' : ''}</div>
      <div class="bar-count">${item.count}</div>
      <div style="font-size:0.7rem;color:var(--muted)">${pct(item.count)}%</div>
    </div>`;
  }).join('')}</div>`;

  // Rows: one per profile, sorted correct first then name
  const rows = profiles
    .map(p => ({ ...p, pick: pickMap[p.id] ?? null }))
    .sort((a, b) => {
      const aCorrect = a.pick === match.result ? 0 : a.pick ? 1 : 2;
      const bCorrect = b.pick === match.result ? 0 : b.pick ? 1 : 2;
      if (aCorrect !== bCorrect) return aCorrect - bCorrect;
      return (a.display_name ?? '').localeCompare(b.display_name ?? '');
    })
    .map(p => {
      const isCorrect = p.pick && p.pick === match.result;
      const isWrong   = p.pick && p.pick !== match.result;
      const pickFlag  = p.pick === 'TEAM1' ? flag1 : p.pick === 'TEAM2' ? flag2 : p.pick === 'DRAW' ? '🤝' : '';
      const pickName  = p.pick === 'TEAM1' ? match.team1 : p.pick === 'TEAM2' ? match.team2 : p.pick === 'DRAW' ? 'Draw' : null;
      const rowClass  = isCorrect ? 'tip-correct' : isWrong ? 'tip-wrong' : 'tip-none';
      const icon      = isCorrect ? '✅' : isWrong ? '❌' : '–';
      return `<div class="tip-row ${rowClass}">
        <span class="tr-name">${escHtml(p.display_name ?? 'Unknown')}</span>
        ${pickName ? `<span class="tr-pick">${pickFlag} ${escHtml(pickName)}</span>` : '<span class="tr-pick" style="color:#cbd5e1">No tip</span>'}
        <span class="tr-icon">${icon}</span>
      </div>`;
    }).join('');

  panel.innerHTML = summaryHTML + `<div class="tips-list">${rows}</div>`;
}

// ── Helpers ──────────────────────────────────────────────────────────────

function formatDayLabel(d) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (target - today) / 86400000;
  if (diff === 0) return '📅 Today';
  if (diff === 1) return '📅 Tomorrow';
  if (diff === -1) return 'Yesterday';
  return d.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' });
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
