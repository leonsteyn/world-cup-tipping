<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Picks — World Cup 2026 Tipping</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/env-config.js"></script>
  <script src="js/config.js"></script>
  <script src="js/flags.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1d4ed8; --blue-d: #1e3a8a; --gold: #f59e0b;
      --bg: #f1f5f9; --card: #fff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --radius: 16px; --red: #dc2626; --green: #16a34a;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    #nav { background: var(--blue-d); color: #fff; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .nav-inner { max-width: 1000px; margin: 0 auto; padding: 0 1.25rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-home { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; }
    .nav-home:hover { color: #fff; }
    .nav-center { flex: 1; text-align: center; }
    .nav-title { font-weight: 800; font-size: 1rem; color: #fff; }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .nav-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.88rem; padding: 0.3rem 0.6rem; border-radius: 8px; }
    .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: #fff; }
    .btn-primary-sm { background: var(--gold); color: #1e293b; border: none; padding: 0.4rem 0.9rem; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; text-decoration: none; }
    .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: rgba(255,255,255,0.8); padding: 0.3rem 0.7rem; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); }

    .page-header { background: linear-gradient(135deg, var(--blue-d), var(--blue)); color: #fff; padding: 2rem 1.5rem; text-align: center; }
    .avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 0.75rem; }
    .page-header h1 { font-size: 1.5rem; font-weight: 900; }
    .page-header p { color: rgba(255,255,255,0.75); font-size: 0.9rem; margin-top: 0.25rem; }

    main { max-width: 800px; margin: 2rem auto 3rem; padding: 0 1.25rem; }

    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat-card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem; text-align: center; }
    .stat-value { font-size: 2rem; font-weight: 900; }
    .stat-value.gold { color: var(--gold); }
    .stat-value.green { color: var(--green); }
    .stat-value.blue { color: var(--blue); }
    .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.2rem; }

    /* Rank card */
    .rank-card { background: var(--card); border-radius: var(--radius); box-shadow: 0 2px 12px rgba(0,0,0,0.06); padding: 1.25rem 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }
    .rank-num { font-size: 2.2rem; font-weight: 900; color: var(--blue-d); }
    .rank-detail { flex: 1; }
    .rank-detail strong { display: block; font-size: 1rem; font-weight: 800; }
    .rank-detail span { font-size: 0.85rem; color: var(--muted); }
    .rank-trophy { font-size: 2rem; }

    /* Picks list */
    .section-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 1rem; }

    .pick-row { background: var(--card); border-radius: 12px; box-shadow: 0 1px 6px rgba(0,0,0,0.05); padding: 0.9rem 1rem; margin-bottom: 0.6rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 0.75rem; }
    .pick-outcome { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .outcome-correct { background: #dcfce7; }
    .outcome-wrong   { background: #fee2e2; }
    .outcome-pending { background: #f1f5f9; }
    .pick-info { min-width: 0; }
    .pick-match { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pick-detail { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .pick-points { font-size: 1.1rem; font-weight: 900; color: var(--blue-d); flex-shrink: 0; }
    .pick-points.zero { color: #cbd5e1; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .empty-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }
    .loading { text-align: center; padding: 3rem; color: var(--muted); }

    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .tab-btn { padding: 0.4rem 1rem; border-radius: 99px; border: 1.5px solid var(--border); background: var(--card); font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted); }
    .tab-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 2rem 1rem; }
  </style>
</head>
<body>

<nav id="nav"></nav>

<div class="page-header">
  <div class="avatar" id="avatar">👤</div>
  <h1 id="profile-name">My Picks</h1>
  <p id="profile-sub">Loading…</p>
</div>

<main>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value gold" id="stat-points">—</div>
      <div class="stat-label">Points</div>
    </div>
    <div class="stat-card">
      <div class="stat-value green" id="stat-correct">—</div>
      <div class="stat-label">Correct Tips</div>
    </div>
    <div class="stat-card">
      <div class="stat-value blue" id="stat-total">—</div>
      <div class="stat-label">Tips Submitted</div>
    </div>
  </div>

  <div class="rank-card" id="rank-card" style="display:none">
    <div class="rank-num" id="rank-num">#—</div>
    <div class="rank-detail">
      <strong id="rank-text">Loading…</strong>
      <span id="rank-sub"></span>
    </div>
    <div class="rank-trophy" id="rank-trophy">🏆</div>
  </div>

  <div class="section-title">My Tips</div>
  <div class="tabs">
    <button class="tab-btn active" onclick="setTab('all')">All</button>
    <button class="tab-btn" onclick="setTab('settled')">Settled</button>
    <button class="tab-btn" onclick="setTab('pending')">Pending</button>
  </div>
  <div id="picks-list" class="loading">Loading your picks…</div>
</main>

<footer>Made with ☀️ in Australia &nbsp;·&nbsp; Part of <a href="https://mrssteyns-games.netlify.app" style="color:inherit">Mrs Steyn's Games</a></footer>

<script src="js/supabase-client.js"></script>
<script>
let allPickData = [];
let currentTab  = 'all';

async function init() {
  await renderNav('profile');
  const user = await getUser();
  if (!user) { window.location.href = 'auth.html'; return; }

  const [profile, picksRes, leaderboardRes] = await Promise.all([
    getProfile(user.id),
    supabase.from('picks').select(`*, matches(*)`).eq('player_id', user.id).order('created_at', { ascending: false }),
    supabase.from('leaderboard').select('*').order('points', { ascending: false }),
  ]);

  // Profile header
  const name = profile?.display_name ?? user.email;
  document.getElementById('profile-name').textContent = name;
  document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
  document.getElementById('profile-sub').textContent = user.email;

  // Picks data
  allPickData = picksRes.data ?? [];
  const settled  = allPickData.filter(p => p.matches?.status === 'FINISHED');
  const correct  = settled.filter(p => p.pick === p.matches?.result);
  const points   = correct.length;

  document.getElementById('stat-points').textContent  = points;
  document.getElementById('stat-correct').textContent = correct.length;
  document.getElementById('stat-total').textContent   = allPickData.length;

  // Rank
  const lb = leaderboardRes.data ?? [];
  const myEntry = lb.find(e => e.id === user.id);
  const myRank  = lb.findIndex(e => e.id === user.id) + 1;
  if (myRank > 0) {
    const rankCard = document.getElementById('rank-card');
    rankCard.style.display = 'flex';
    document.getElementById('rank-num').textContent = `#${myRank}`;
    document.getElementById('rank-text').textContent = `Ranked ${myRank} of ${lb.length} players`;
    document.getElementById('rank-sub').textContent  = `${points} point${points !== 1 ? 's' : ''} scored`;
    document.getElementById('rank-trophy').textContent =
      myRank === 1 ? '🥇' : myRank === 2 ? '🥈' : myRank === 3 ? '🥉' : '🏅';
  }

  renderPicks();
}

function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['all','settled','pending'][i] === tab);
  });
  renderPicks();
}

function renderPicks() {
  const container = document.getElementById('picks-list');
  let data = allPickData;
  if (currentTab === 'settled') data = data.filter(p => p.matches?.status === 'FINISHED');
  if (currentTab === 'pending') data = data.filter(p => p.matches?.status !== 'FINISHED');

  if (data.length === 0) {
    container.innerHTML = `<div class="empty-state"><span class="empty-icon">🎯</span><p>No tips here yet. <a href="matches.html" style="color:var(--blue)">Go tip some matches!</a></p></div>`;
    return;
  }

  container.innerHTML = data.map(p => {
    const m = p.matches;
    if (!m) return '';
    const flag1 = getFlag(m.team1, m.team1_country_code);
    const flag2 = getFlag(m.team2, m.team2_country_code);
    const finished = m.status === 'FINISHED';
    const correct  = finished && p.pick === m.result;
    const wrong    = finished && p.pick !== m.result;

    const outcomeIcon = correct ? '✅' : wrong ? '❌' : '⏳';
    const outcomeCls  = correct ? 'outcome-correct' : wrong ? 'outcome-wrong' : 'outcome-pending';

    const pickLabel = p.pick === 'TEAM1' ? `${flag1} ${m.team1}`
                    : p.pick === 'TEAM2' ? `${flag2} ${m.team2}`
                    : 'Draw';

    const resultLabel = !finished ? 'Not played yet'
      : m.result === 'TEAM1' ? `Result: ${flag1} ${m.team1} won`
      : m.result === 'TEAM2' ? `Result: ${flag2} ${m.team2} won`
      : 'Result: Draw';

    const matchDate = new Date(m.match_date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    const points = correct ? '+1' : wrong ? '0' : '—';
    const ptsCls = correct ? '' : ' zero';

    return `
      <div class="pick-row">
        <div class="pick-outcome ${outcomeCls}">${outcomeIcon}</div>
        <div class="pick-info">
          <div class="pick-match">${escHtml(flag1)} ${escHtml(m.team1)} vs ${escHtml(flag2)} ${escHtml(m.team2)}</div>
          <div class="pick-detail">Your pick: <strong>${escHtml(pickLabel)}</strong> &nbsp;·&nbsp; ${escHtml(resultLabel)} &nbsp;·&nbsp; ${matchDate}</div>
        </div>
        <div class="pick-points${ptsCls}">${points}</div>
      </div>`;
  }).join('');
}

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
</body>
</html>
