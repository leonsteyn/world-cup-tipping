<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register / Login — World Cup 2026 Tipping</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #1d4ed8; --blue-d: #1e3a8a; --gold: #f59e0b;
      --bg: #f1f5f9; --card: #fff; --text: #1e293b; --muted: #64748b;
      --border: #e2e8f0; --radius: 16px; --red: #dc2626;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    #nav { background: var(--blue-d); color: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.2); }
    .nav-inner { max-width: 1000px; margin: 0 auto; padding: 0 1.25rem; display: flex; align-items: center; gap: 1rem; height: 56px; }
    .nav-home { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.85rem; }
    .nav-home:hover { color: #fff; }
    .nav-center { flex: 1; text-align: center; }
    .nav-title { font-weight: 800; font-size: 1rem; color: #fff; }
    .nav-links { display: flex; gap: 0.5rem; align-items: center; }
    .nav-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.88rem; padding: 0.3rem 0.6rem; border-radius: 8px; }
    .nav-link:hover { background: rgba(255,255,255,0.15); color: #fff; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

    .auth-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 4px 32px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }
    .auth-header { background: linear-gradient(135deg, var(--blue-d), var(--blue)); color: #fff; padding: 2rem; text-align: center; }
    .auth-header .emoji { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
    .auth-header h1 { font-size: 1.3rem; font-weight: 900; }
    .auth-header p { font-size: 0.88rem; color: rgba(255,255,255,0.8); margin-top: 0.3rem; }

    .tabs { display: flex; border-bottom: 2px solid var(--border); }
    .tab { flex: 1; padding: 0.9rem; text-align: center; font-weight: 700; font-size: 0.95rem; cursor: pointer; color: var(--muted); border: none; background: none; transition: color 0.15s; }
    .tab.active { color: var(--blue); border-bottom: 2px solid var(--blue); margin-bottom: -2px; }

    .panel { padding: 1.75rem; display: none; }
    .panel.active { display: block; }

    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
    input { width: 100%; padding: 0.65rem 0.9rem; border: 1.5px solid var(--border); border-radius: 10px; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.15s; }
    input:focus { border-color: var(--blue); }
    input::placeholder { color: #cbd5e1; }

    .btn-submit { width: 100%; padding: 0.75rem; background: var(--blue); color: #fff; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: background 0.15s, transform 0.1s; margin-top: 0.5rem; }
    .btn-submit:hover { background: var(--blue-d); }
    .btn-submit:active { transform: scale(0.98); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg { font-size: 0.88rem; padding: 0.65rem 0.9rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
    .msg.error { background: #fee2e2; color: #991b1b; display: block; }
    .msg.success { background: #dcfce7; color: #166534; display: block; }

    .divider { text-align: center; color: var(--muted); font-size: 0.82rem; margin: 0.75rem 0; }

    footer { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 1.5rem; }
  </style>
</head>
<body>

<nav id="nav">
  <div class="nav-inner">
    <a href="https://mrssteyns-games.netlify.app" class="nav-home">🎮 Mrs Steyn's Games</a>
    <div class="nav-center"><span class="nav-title">⚽ FIFA World Cup 2026</span></div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">🏆 Leaderboard</a>
      <a href="matches.html" class="nav-link">📅 Fixtures</a>
    </div>
  </div>
</nav>

<main>
  <div class="auth-card">
    <div class="auth-header">
      <span class="emoji">⚽</span>
      <h1>World Cup 2026 Tipping</h1>
      <p>Join the competition — it's free!</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('register')">Register</button>
      <button class="tab" onclick="switchTab('login')">Login</button>
    </div>

    <!-- Register -->
    <div class="panel active" id="panel-register">
      <div class="msg" id="reg-msg"></div>
      <div class="form-group">
        <label for="reg-name">Display Name</label>
        <input id="reg-name" type="text" placeholder="e.g. Alex J" maxlength="30" autocomplete="nickname"/>
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="At least 6 characters" autocomplete="new-password"/>
      </div>
      <button class="btn-submit" onclick="register()">Create Account →</button>
    </div>

    <!-- Login -->
    <div class="panel" id="panel-login">
      <div class="msg" id="login-msg"></div>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="Your password" autocomplete="current-password"/>
      </div>
      <button class="btn-submit" onclick="login()">Login →</button>
    </div>
  </div>
</main>

<footer>Part of <a href="https://mrssteyns-games.netlify.app" style="color:inherit">Mrs Steyn's Games</a></footer>

<script>
const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Redirect if already logged in
_supabase.auth.getUser().then(({ data: { user } }) => {
  if (user) window.location.href = 'matches.html';
});

// Show register tab if hash = #register, login if #login
if (location.hash === '#login') switchTab('login');

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'register') || (i === 1 && tab === 'login'));
  });
  document.getElementById('panel-register').classList.toggle('active', tab === 'register');
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg ${type}`;
}

async function register() {
  const name  = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass  = document.getElementById('reg-password').value;

  if (!name) return showMsg('reg-msg', 'Please enter a display name.', 'error');
  if (!email) return showMsg('reg-msg', 'Please enter your email.', 'error');
  if (pass.length < 6) return showMsg('reg-msg', 'Password must be at least 6 characters.', 'error');

  const btn = document.querySelector('#panel-register .btn-submit');
  btn.disabled = true; btn.textContent = 'Creating account…';

  const { data, error } = await _supabase.auth.signUp({ email, password: pass });
  if (error) {
    showMsg('reg-msg', error.message, 'error');
    btn.disabled = false; btn.textContent = 'Create Account →';
    return;
  }

  // Create profile
  const userId = data.user?.id;
  if (userId) {
    await _supabase.from('profiles').insert({ id: userId, display_name: name });
  }

  showMsg('reg-msg', '🎉 Account created! Redirecting to fixtures…', 'success');
  setTimeout(() => window.location.href = 'matches.html', 1500);
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  if (!email || !pass) return showMsg('login-msg', 'Please fill in all fields.', 'error');

  const btn = document.querySelector('#panel-login .btn-submit');
  btn.disabled = true; btn.textContent = 'Logging in…';

  const { error } = await _supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    showMsg('login-msg', error.message, 'error');
    btn.disabled = false; btn.textContent = 'Login →';
    return;
  }
  window.location.href = 'matches.html';
}

// Allow Enter key to submit
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const active = document.querySelector('.panel.active');
  if (active?.id === 'panel-register') register();
  else if (active?.id === 'panel-login') login();
});
</script>
</body>
</html>
